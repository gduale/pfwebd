# /etc/doas.conf — entries required by pfwebd.
#
# The _pfwebd user may run ONLY these exact pfctl invocations, plus the
# pfwebd-table wrapper (which validates its own arguments — see
# examples/pfwebd-table). Keep this list in sync with the allowlist in
# internal/pfctl/runner.go.

permit nopass _pfwebd as root cmd /sbin/pfctl args -s info
permit nopass _pfwebd as root cmd /sbin/pfctl args -s states
permit nopass _pfwebd as root cmd /sbin/pfctl args -s rules -v
permit nopass _pfwebd as root cmd /sbin/pfctl args -s Interfaces -v
permit nopass _pfwebd as root cmd /sbin/pfctl args -s Tables
permit nopass _pfwebd as root cmd /usr/local/sbin/pfwebd-table

# Live pflog stream (read-only packet capture on the pflog interface)
permit nopass _pfwebd as root cmd /usr/sbin/tcpdump args -n -e -ttt -l -i pflog0

# Rules are passed on stdin; the argument vectors are fixed.
permit nopass _pfwebd as root cmd /sbin/pfctl args -a pfwebd -n -f -
permit nopass _pfwebd as root cmd /sbin/pfctl args -a pfwebd -f -
permit nopass _pfwebd as root cmd /sbin/pfctl args -a pfwebd -F rules
permit nopass _pfwebd as root cmd /sbin/pfctl args -a pfwebd -s rules
