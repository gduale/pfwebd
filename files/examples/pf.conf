# Example /etc/pf.conf for a firewall managed (partially) by pfwebd.
#
# Key idea: pfwebd never edits this file. It will only ever manage rules
# inside the "pfwebd" anchor below. Your base rules including the ones
# guaranteeing SSH and UI access stay untouched.
#
# Policy:
#   - ext_if: all inbound traffic is blocked, no exceptions.
#   - int_if: only SSH (22), the pfwebd UI (8080), and ICMP are allowed,
#     and only from $lan_net.
#   - all outbound traffic is allowed.

ext_if = "vio1"

# LAN interface
int_if = "vio0"
lan_net = "192.168.64.0/24"

set skip on lo

# Tables managed by the pfwebd (start pfwebd with:
#   -rw-tables blocklist,allowlist
# ). "persist" keeps them loaded even when no rule references them.
# Not referenced by the base rules below (ext_if is fully closed and
# int_if only opens specific ports) - available for the "pfwebd" anchor
# to use against LAN traffic if needed.
table <blocklist> persist
table <allowlist> persist

# Default deny, log blocked packets to pflog0
block return log all

# ext_if: no inbound traffic is allowed, period.
block in quick log on $ext_if all

# int_if: SSH, the pfwebd UI, and ICMP from the LAN only.
# These rules are OUTSIDE the anchor so pfwebd can never remove them.
pass in quick log on $int_if inet proto tcp from $lan_net to ($int_if) port { 22, 8080 }
pass in quick log on $int_if inet proto icmp from $lan_net to ($int_if)

# All outbound traffic is allowed.
pass out quick on $ext_if inet keep state
pass out quick on $int_if inet keep state

# Rules managed by the pfwebd live here. The UI loads them with
# "pfctl -a pfwebd -f -" and they are evaluated at this position.
# Flush them anytime with: pfctl -a pfwebd -F rules
anchor "pfwebd"
